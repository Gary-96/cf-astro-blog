<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- 基底质感微光渐变 (Subtle Rim Gradient) -->
    <linearGradient id="gl-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- 主几何结构冷色高光渐变 (Linear-style Glow) -->
    <linearGradient id="gl-surface" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- 内部暗部结构映射 -->
    <linearGradient id="gl-dark-facet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- 1. 哑光极客底托：Squircle (连续超椭圆轮廓) -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#090d16" stroke="url(#gl-rim)" stroke-width="1.2" />

  <!-- 2. 背景超微环境辉光 (Subtle Ambient Glow) -->
  <circle cx="60" cy="60" r="32" fill="#38bdf8" opacity="0.07" filter="blur(16px)" />

  <!-- 3. 主体几何多边形：抽象解构 G/L 拓扑路径 -->
  <!-- 左侧与底部外壳：稳固的折线外缘 -->
  <path d="M 60 26 
           L 84 40 
           L 84 52 
           L 60 38 
           L 38 51 
           L 38 73 
           L 60 86 
           L 82 73 
           L 82 64 
           L 60 64 
           L 60 54 
           L 94 54 
           L 94 79 
           L 60 98 
           L 26 79 
           L 26 46 
           Z" 
        fill="url(#gl-surface)" />

  <!-- 内部棱镜刻面 (几何穿插感) -->
  <polygon points="60,38 76,47 60,56 44,47" fill="#ffffff" opacity="0.14" />
  <polygon points="60,64 74,64 60,72 46,64" fill="#000000" opacity="0.25" />

  <!-- 核心微型能量聚焦点 (Core Pulse Dot) -->
  <circle cx="60" cy="47" r="2.8" fill="#e0f2fe" />
</svg>
